name = "mushrifi-license-server"
main = "src/index.ts"
compatibility_date = "2026-11-15"

[[d1_databases]]
binding = "DB"
database_name = "mushrifi-licenses"
database_id = "bb241e07-ed80-4a29-b10f-7ebe7b104cf8"

# Production/root bindings. Keep these unchanged unless a production change is explicitly approved.
[[ratelimits]]
name = "RATE_LIMIT_CHALLENGE"
namespace_id = "2026111901"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RATE_LIMIT_ACTIVATE"
namespace_id = "2026111902"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RATE_LIMIT_VALIDATE"
namespace_id = "2026111903"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RATE_LIMIT_ADMIN"
namespace_id = "2026111904"

  [ratelimits.simple]
  limit = 30
  period = 60

# Isolated staging environment. Replace the D1 placeholder only after creating
# a NEW empty staging database in the intended Cloudflare account.
[env.staging]
name = "mushrifi-license-server-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "mushrifi-licenses-staging"
database_id = "31d1c090-a7d9-4175-adc5-f1f35dba4b28"

[[env.staging.ratelimits]]
name = "RATE_LIMIT_CHALLENGE"
namespace_id = "2026111911"

  [env.staging.ratelimits.simple]
  limit = 30
  period = 60

[[env.staging.ratelimits]]
name = "RATE_LIMIT_ACTIVATE"
namespace_id = "2026111912"

  [env.staging.ratelimits.simple]
  limit = 10
  period = 60

[[env.staging.ratelimits]]
name = "RATE_LIMIT_VALIDATE"
namespace_id = "2026111913"

  [env.staging.ratelimits.simple]
  limit = 20
  period = 60

[[env.staging.ratelimits]]
name = "RATE_LIMIT_ADMIN"
namespace_id = "2026111914"

  [env.staging.ratelimits.simple]
  limit = 30
  period = 60
