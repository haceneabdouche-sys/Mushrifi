plugins { id 'com.android.application' }

def defaultLicenseApi = "https://mushrifi-license-server.hacene47211.workers.dev"
def configuredLicenseApi = providers.gradleProperty("mushrifiLicenseApi").getOrElse(defaultLicenseApi)
def stagingLicenseBuild = providers.gradleProperty("mushrifiStaging").map { it.toBoolean() }.getOrElse(false)
if (!configuredLicenseApi.startsWith("https://") || configuredLicenseApi.endsWith("/")) {
    throw new GradleException("mushrifiLicenseApi must be an HTTPS origin without a trailing slash")
}

android {
    buildFeatures {
        buildConfig true
    }
    namespace 'dz.mushrifi.app'
    compileSdk 35
    defaultConfig {
        applicationId 'dz.mushrifi.app.offline'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '2.3.0'
        buildConfigField 'String', 'MUSHRIFI_LICENSE_API', "\"${configuredLicenseApi}\""
    }

    // Release signing is enabled only from protected CI secrets; never commit a keystore.
    signingConfigs {
        release {
            if (System.getenv('MUSHRIFI_KEYSTORE_PATH')) {
                storeFile file(System.getenv('MUSHRIFI_KEYSTORE_PATH'))
                storePassword System.getenv('MUSHRIFI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MUSHRIFI_KEY_ALIAS')
                keyPassword System.getenv('MUSHRIFI_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // A staging debug APK installs alongside the normal app and cannot replace it.
            if (stagingLicenseBuild) {
                applicationIdSuffix '.staging'
                versionNameSuffix '-staging'
            }
        }
        release {
            if (System.getenv('MUSHRIFI_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}


// Generate the launcher image from the checked-in base64 source before Android resources are merged.
def launcherIconSource = rootProject.file('mushrifi-launcher.jpg.b64')
def launcherIconOutput = file('src/main/res/drawable-nodpi/ic_launcher_photo.jpg')
def launcherForegroundSource = rootProject.file('mushrifi-launcher-foreground.png.b64')
def launcherForegroundOutput = file('src/main/res/drawable-nodpi/ic_launcher_foreground.png')
tasks.register('generateLauncherIcon') {
    inputs.file(launcherIconSource)
    outputs.files(launcherIconOutput, launcherForegroundOutput)
    doLast {
        launcherIconOutput.parentFile.mkdirs()
        launcherIconOutput.bytes = java.util.Base64.decoder.decode(launcherIconSource.text.trim())
        launcherForegroundOutput.bytes = java.util.Base64.decoder.decode(launcherForegroundSource.text.trim())
    }
}
tasks.named('preBuild').configure {
    dependsOn(tasks.named('generateLauncherIcon'))
}
