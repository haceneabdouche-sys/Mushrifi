name: Inspect Mushrifi license Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mushrifi-license-staging-inspect
  cancel-in-progress: false

jobs:
  inspect-staging:
    name: Read-only Staging checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the licensing development branch
        uses: actions/checkout@v4
        with:
          ref: feature/device-license-foundation

      - name: Verify TypeScript and install Wrangler
        working-directory: licensing/worker
        run: |
          npm install
          npm run check

      - name: Print Staging license indexes (read-only)
        working-directory: licensing/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute mushrifi-licenses-staging --remote --command "SELECT name, sql FROM sqlite_master WHERE type = 'index' AND tbl_name = 'licenses' ORDER BY name;" --config wrangler.staging.toml --json
