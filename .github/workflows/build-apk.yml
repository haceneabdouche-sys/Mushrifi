name: Build Mushrifi APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare transparent full-color signature logo
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          from PIL import Image
          import numpy as np
          src = 'android/app/src/main/assets/signature-real.jpg'
          dst = 'android/app/src/main/assets/signature-color.png'
          arr = np.asarray(Image.open(src).convert('RGB'), dtype=np.float32)
          alpha = 255 - arr.min(axis=2)
          alpha[alpha < 8] = 0
          denom = np.maximum(alpha[..., None], 1)
          rgb = np.clip((arr - (255 - alpha[..., None])) * 255.0 / denom, 0, 255).astype(np.uint8)
          rgba = np.dstack((rgb, alpha.astype(np.uint8)))
          logo = Image.fromarray(rgba, 'RGBA')
          bbox = logo.getbbox()
          logo = logo.crop(bbox)
          side = max(logo.size)
          pad = int(side * 0.08)
          canvas = Image.new('RGBA', (side + 2 * pad, side + 2 * pad), (0, 0, 0, 0))
          canvas.alpha_composite(logo, ((side - logo.width) // 2 + pad, (side - logo.height) // 2 + pad))
          canvas.resize((512, 512), Image.Resampling.LANCZOS).save(dst, optimize=True)
          PY
      - name: Validate embedded JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.current = []
              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      self.parts.append("".join(self.current))
                      self.in_script = False

          parser = ScriptExtractor()
          parser.feed(Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8"))
          source = "\\n".join(part for part in parser.parts if part.strip())
          if not source.strip():
              raise SystemExit("No inline JavaScript found in Mushrifi index.html")
          Path("/tmp/mushrifi-inline.js").write_text(source, encoding="utf-8")
          PY
          node --check /tmp/mushrifi-inline.js
      - name: Package complete Android project
        run: |
          zip -r Mushrifi-Complete-Source.zip . \
            -x ".git/*" "android/.gradle/*" "android/app/build/*" "android/build/*"
      - name: Upload complete source project
        uses: actions/upload-artifact@v4
        with:
          name: mushrifi-complete-source
          path: Mushrifi-Complete-Source.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mushrifi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
