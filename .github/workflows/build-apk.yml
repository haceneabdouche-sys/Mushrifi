name: Build Mushrifi APK
on:
  pull_request:
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
  push:
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare transparent full-color signature logo
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          from PIL import Image
          import numpy as np
          src = 'android/app/src/main/assets/signature-real.jpg'
          dst = 'android/app/src/main/assets/signature-color.png'
          arr = np.asarray(Image.open(src).convert('RGB'), dtype=np.float32)
          alpha = 255 - arr.min(axis=2)
          alpha[alpha < 8] = 0
          denom = np.maximum(alpha[..., None], 1)
          rgb = np.clip((arr - (255 - alpha[..., None])) * 255.0 / denom, 0, 255).astype(np.uint8)
          rgba = np.dstack((rgb, alpha.astype(np.uint8)))
          logo = Image.fromarray(rgba, 'RGBA')
          bbox = logo.getbbox()
          logo = logo.crop(bbox)
          side = max(logo.size)
          pad = int(side * 0.08)
          canvas = Image.new('RGBA', (side + 2 * pad, side + 2 * pad), (0, 0, 0, 0))
          canvas.alpha_composite(logo, ((side - logo.width) // 2 + pad, (side - logo.height) // 2 + pad))
          canvas.resize((512, 512), Image.Resampling.LANCZOS).save(dst, optimize=True)
          PY
      - name: Prepare permanent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSHRIFI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing MUSHRIFI_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mushrifi-release.jks"
          test -s "$RUNNER_TEMP/mushrifi-release.jks"
      - name: Validate release signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MUSHRIFI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSHRIFI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSHRIFI_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing MUSHRIFI_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing MUSHRIFI_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing MUSHRIFI_KEY_PASSWORD secret"; exit 1; }
      - name: Validate embedded JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.current = []
              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      self.parts.append("".join(self.current))
                      self.in_script = False

          parser = ScriptExtractor()
          parser.feed(Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8"))
          source = "\n".join(part for part in parser.parts if part.strip())
          if not source.strip():
              raise SystemExit("No inline JavaScript found in Mushrifi index.html")
          Path("/tmp/mushrifi-inline.js").write_text(source, encoding="utf-8")
          PY
          node --check /tmp/mushrifi-inline.js
      - name: Run recent activity student navigation tests
        run: node tests/recent-activity-navigation.test.cjs
      - name: Run individual attendance editing and hours parsing tests
        run: node tests/attendance-editing.test.cjs
      - name: Run student history matching and synthetic aggregation tests
        run: node tests/student-history-matching.test.cjs
      - name: Run shared theme token regression tests
        run: node tests/theme-tokens.test.cjs
      - name: Run absence streak regression tests
        run: node tests/absence-streak.test.cjs
      - name: Run academic branch alias regression tests
        run: node tests/academic-branches.test.cjs
      - name: Run CSV import matching regression tests
        run: node tests/csv-import-matching.test.cjs
      - name: Run signature pad integration tests
        run: node tests/signature-pad.test.cjs
      - name: Run universal education setup tests
        run: node tests/universal-setup.test.cjs
      - name: Run reminder scheduling regression tests
        run: node tests/reminder-scheduling.test.cjs
      - name: Run summons reminder validation regression tests
        run: node tests/summons-reminder-validation.test.cjs
      - name: Run license read-only and backup safety regression tests
        run: node tests/license-readonly.test.cjs
      - name: Run backup restore rollback regression tests
        run: node tests/backup-restore-safety.test.cjs
      - name: Run isolated Staging API smoke test (does not issue a license)
        env:
          MUSHRIFI_LICENSE_API: https://mushrifi-license-server-staging.hacene47211.workers.dev
        run: node licensing/worker/scripts/smoke-test.mjs
      - name: Prepare dedicated Staging signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STAGING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STAGING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STAGING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing STAGING_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing STAGING_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing STAGING_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing STAGING_KEY_PASSWORD secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mushrifi-staging.jks"
          test -s "$RUNNER_TEMP/mushrifi-staging.jks"
          keytool -list -keystore "$RUNNER_TEMP/mushrifi-staging.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build isolated Staging APK with persistent signing
        env:
          MUSHRIFI_STAGING_KEYSTORE_PATH: ${{ runner.temp }}/mushrifi-staging.jks
          MUSHRIFI_STAGING_KEYSTORE_PASSWORD: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
          MUSHRIFI_STAGING_KEY_ALIAS: ${{ secrets.STAGING_KEY_ALIAS }}
          MUSHRIFI_STAGING_KEY_PASSWORD: ${{ secrets.STAGING_KEY_PASSWORD }}
        run: >-
          gradle --no-daemon -p android assembleDebug
          -PmushrifiLicenseApi=https://mushrifi-license-server-staging.hacene47211.workers.dev
          -PmushrifiStaging=true
      - name: Verify Staging APK signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload Staging test APK
        uses: actions/upload-artifact@v4
        with:
          name: mushrifi-staging-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Package complete Android project
        run: |
          zip -r Mushrifi-Complete-Source.zip . \
            -x ".git/*" "android/.gradle/*" "android/app/build/*" "android/build/*"
      - name: Upload complete source project
        uses: actions/upload-artifact@v4
        with:
          name: mushrifi-complete-source
          path: Mushrifi-Complete-Source.zip
          if-no-files-found: error
          retention-days: 30
      - name: Confirm individual student file fix is included
        run: grep -q 'const attendanceList=items=>' android/app/src/main/assets/index.html
      - name: Build signed release APK
        env:
          MUSHRIFI_KEYSTORE_PATH: ${{ runner.temp }}/mushrifi-release.jks
          MUSHRIFI_KEYSTORE_PASSWORD: ${{ secrets.MUSHRIFI_KEYSTORE_PASSWORD }}
          MUSHRIFI_KEY_ALIAS: ${{ secrets.MUSHRIFI_KEY_ALIAS }}
          MUSHRIFI_KEY_PASSWORD: ${{ secrets.MUSHRIFI_KEY_PASSWORD }}
        run: gradle --no-daemon -p android assembleRelease
      - name: Verify release APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: mushrifi-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
