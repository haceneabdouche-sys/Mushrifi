name: Build Mushrifi APK
# Rebuild requested for corrected dashboard counter selector
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package complete Android project
        run: |
          zip -r Mushrifi-Complete-Source.zip . \
            -x ".git/*" "android/.gradle/*" "android/app/build/*" "android/build/*"
      - name: Upload complete source project
        uses: actions/upload-artifact@v4
        with:
          name: mushrifi-complete-source
          path: Mushrifi-Complete-Source.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mushrifi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
