name: Build Mushrifi APK
on:
  push:
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent Mushrifi debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/mushrifi-debug.keystore
          key: mushrifi-android-debug-signing-v1
      - name: Ensure persistent debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/mushrifi-debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/mushrifi-debug.keystore" -storetype JKS -storepass android -alias mushrifi -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mushrifi Debug,O=Mushrifi,C=US"
          fi
      - name: Prepare transparent full-color signature logo
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          from PIL import Image
          import numpy as np
          src = 'android/app/src/main/assets/signature-real.jpg'
          dst = 'android/app/src/main/assets/signature-color.png'
          arr = np.asarray(Image.open(src).convert('RGB'), dtype=np.float32)
          alpha = 255 - arr.min(axis=2)
          alpha[alpha < 8] = 0
          denom = np.maximum(alpha[..., None], 1)
          rgb = np.clip((arr - (255 - alpha[..., None])) * 255.0 / denom, 0, 255).astype(np.uint8)
          rgba = np.dstack((rgb, alpha.astype(np.uint8)))
          logo = Image.fromarray(rgba, 'RGBA')
          bbox = logo.getbbox()
          logo = logo.crop(bbox)
          side = max(logo.size)
          pad = int(side * 0.08)
          canvas = Image.new('RGBA', (side + 2 * pad, side + 2 * pad), (0, 0, 0, 0))
          canvas.alpha_composite(logo, ((side - logo.width) // 2 + pad, (side - logo.height) // 2 + pad))
          canvas.resize((512, 512), Image.Resampling.LANCZOS).save(dst, optimize=True)
          PY
      - name: Validate embedded JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.current = []
              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      self.parts.append("".join(self.current))
                      self.in_script = False

          parser = ScriptExtractor()
          parser.feed(Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8"))
          source = "\n".join(part for part in parser.parts if part.strip())
          if not source.strip():
              raise SystemExit("No inline JavaScript found in Mushrifi index.html")
          Path("/tmp/mushrifi-inline.js").write_text(source, encoding="utf-8")
          PY
          node --check /tmp/mushrifi-inline.js
      - name: Run absence streak regression tests
        run: node tests/absence-streak.test.cjs
      - name: Run Stage 28 automatic absence notice and warning workflow tests
        run: node tests/absence-stage-automation-stage28.test.cjs
      - name: Run Stage 29 absence workflow lifecycle and settlement tests
        run: node tests/absence-workflow-stage29.test.cjs
      - name: Run academic branch alias regression tests
        run: node tests/academic-branches.test.cjs
      - name: Run license read-only and backup safety regression tests
        run: node tests/license-readonly.test.cjs
      - name: Run individual absence hours regression tests
        run: node tests/individual-absence-hours.test.cjs
      - name: Run backup protection warning regression tests
        run: node tests/backup-protection-warning.test.cjs
      - name: Run database corruption guard regression tests
        run: node tests/database-corruption-guard.test.cjs
      - name: Run Stage 17 verified transactional local database write tests
        run: node tests/local-db-transactional-write-stage17.test.cjs
      - name: Run Stage 18 recovery snapshot transaction and migration tests
        run: node tests/recovery-snapshot-transaction-stage18.test.cjs
      - name: Run Stage 19 read-only database health diagnostics tests
        run: node tests/database-health-stage19.test.cjs
      - name: Run Stage 20 Android encryption key lifecycle safety tests
        run: node tests/database-encryption-key-safety-stage20.test.cjs
      - name: Run Stage 21 student privacy markers and guardian address tests
        run: node tests/student-privacy-markers-guardian-address-stage21.test.cjs
      - name: Run Stage 22 safe guardian address import tests
        run: node tests/guardian-address-import-stage22.test.cjs
      - name: Run Stage 23 compact dashboard, voice interaction and supervisor attribution tests
        run: node tests/focused-dashboard-voice-stage23.test.cjs
      - name: Run Stage 24 real voice action routing and disclosure visibility tests
        run: node tests/voice-action-routing-stage24.test.cjs
      - name: Run Stage 25 mobile responsiveness performance regression tests
        run: node tests/performance-stage25.test.cjs
      - name: Run Stage 26 supervision duty register tests
        run: node tests/supervision-log-stage26.test.cjs
      - name: Run Stage 27 guardian reception register tests
        run: node tests/guardian-reception-stage27.test.cjs
      - name: Run backup identity integrity and restore rollback tests
        run: node tests/backup-restore-integrity.test.cjs
      - name: Run backup manifest integrity and legacy compatibility tests
        run: node tests/backup-manifest-integrity.test.cjs
      - name: Run native SHA-256 test vectors
        run: |
          mkdir -p /tmp/mushrifi-backup-integrity
          javac -d /tmp/mushrifi-backup-integrity android/app/src/main/java/dz/mushrifi/app/BackupIntegrity.java tests/BackupIntegrityTest.java
          java -cp /tmp/mushrifi-backup-integrity dz.mushrifi.app.BackupIntegrityTest
      - name: Run native transactional restore contract tests
        run: node tests/backup-native-transaction.test.cjs
      - name: Run reports, print and voice shortcut regression tests
        run: node tests/reports-print-voice.test.cjs
      - name: Run student profile, bulk attendance and guardian messaging integrity tests
        run: node tests/student-profile-bulk-messaging.test.cjs
      - name: Run student profile history and duration integrity tests
        run: node tests/student-profile-integrity.test.cjs
      - name: Run indexed student profile record lookup and identity safety tests
        run: node tests/student-profile-record-index.test.cjs
      - name: Run notification permission and summons reminder integrity tests
        run: node tests/summons-notification-permissions.test.cjs
      - name: Run exact alarm permission status regression tests
        run: node tests/exact-alarm-permission-status.test.cjs
      - name: Run smart daily dashboard regression tests
        run: node tests/smart-daily-dashboard.test.cjs
      - name: Run actionable daily follow-up dashboard integrity tests
        run: node tests/daily-followup-dashboard.test.cjs
      - name: Run educational follow-up review dashboard safety tests
        run: node tests/educational-followup-review.test.cjs
      - name: Run agenda calendar, backup and audit integrity tests
        run: node tests/agenda-calendar.test.cjs
      - name: Run recurring agenda integrity and reminder regression tests
        run: node tests/agenda-recurring.test.cjs
      - name: Run agenda time conflict detection regression tests
        run: node tests/agenda-conflicts.test.cjs
      - name: Run agenda alternative time slot regression tests
        run: node tests/agenda-alternatives.test.cjs
      - name: Run agenda Android notification scheduling regression tests
        run: node tests/agenda-notification-scheduling.test.cjs
      - name: Run educational follow-up reminder payload and privacy tests
        run: node tests/student-followup-reminders.test.cjs
      - name: Run Java local-time agenda reminder planner tests
        run: |
          mkdir -p /tmp/mushrifi-agenda-planner
          javac -d /tmp/mushrifi-agenda-planner android/app/src/main/java/dz/mushrifi/app/AgendaReminderPlanner.java tests/AgendaReminderPlannerTest.java
          java -cp /tmp/mushrifi-agenda-planner dz.mushrifi.app.AgendaReminderPlannerTest
      - name: Run Java educational follow-up reminder planner tests
        run: |
          mkdir -p /tmp/mushrifi-followup-planner
          javac -d /tmp/mushrifi-followup-planner android/app/src/main/java/dz/mushrifi/app/StudentFollowupReminderPlanner.java tests/StudentFollowupReminderPlannerTest.java
          java -cp /tmp/mushrifi-followup-planner dz.mushrifi.app.StudentFollowupReminderPlannerTest
      - name: Run audit log integrity regression tests
        run: node tests/audit-log-integrity.test.cjs
      - name: Run audit student lookup save-path performance tests
        run: node tests/audit-student-lookup-performance.test.cjs
      - name: Run Stage 2 preindexed audit snapshot performance and parity tests
        run: node tests/audit-snapshot-index-stage2.test.cjs
      - name: Run Stage 3 bounded bulk audit allocation and parity tests
        run: node tests/audit-bulk-summary-stage3.test.cjs
      - name: Run Stage 4 lazy student directory index and identity safety tests
        run: node tests/student-directory-lazy-index-stage4.test.cjs
      - name: Run Stage 5 bounded Home recent activity name-resolution tests
        run: node tests/home-recent-lookup-stage5.test.cjs
      - name: Run Stage 6 long-record search cache correctness tests
        run: node tests/record-search-cache-stage6.test.cjs
      - name: Run student analytics aggregation and data safety regression tests
        run: node tests/student-analytics.test.cjs
      - name: Run comprehensive student PDF report regression tests
        run: node tests/student-comprehensive-report.test.cjs
      - name: Run comprehensive student timeline regression tests
        run: node tests/student-timeline.test.cjs
      - name: Run student educational follow-up record integrity tests
        run: node tests/student-followup-integrity.test.cjs
      - name: Run CSV import identity safety regression tests
        run: node tests/csv-import-identity-safety.test.cjs
      - name: Run easy navigation layout regression tests
        run: node tests/easy-navigation-layout.test.cjs
      - name: Run Arabic-aware student directory search regression tests
        run: node tests/student-directory-search.test.cjs
      - name: Run Stage 13 navigation and information architecture tests
        run: node tests/ui-organization-stage13.test.cjs
      - name: Run Stage 14 unified design system and responsive UI tests
        run: node tests/ui-design-system-stage14.test.cjs
      - name: Run Stage 15 unified student profile workflow tests
        run: node tests/student-profile-hub-stage15.test.cjs
      - name: Run Stage 16 WebView navigation policy tests
        run: |
          mkdir -p /tmp/mushrifi-webview-policy
          javac -d /tmp/mushrifi-webview-policy android/app/src/main/java/dz/mushrifi/app/WebViewNavigationPolicy.java tests/WebViewNavigationPolicyTest.java
          java -cp /tmp/mushrifi-webview-policy dz.mushrifi.app.WebViewNavigationPolicyTest
      - name: Run Stage 16 native WebView security wiring tests
        run: node tests/webview-security-stage16.test.cjs
      - name: Run mobile performance regression tests
        run: node tests/mobile-performance.test.cjs
      - name: Run cached absence analysis and navigation performance tests
        run: node tests/performance-cache-stage26.test.cjs
      - name: Package complete Android project
        run: |
          zip -r Mushrifi-Complete-Source.zip . \
            -x ".git/*" "android/.gradle/*" "android/app/build/*" "android/build/*"
      - name: Upload complete source project
        uses: actions/upload-artifact@v4
        with:
          name: mushrifi-complete-source
          path: Mushrifi-Complete-Source.zip
          if-no-files-found: error
          retention-days: 30
      - name: Confirm student profile safety and duration fixes are included
        run: |
          grep -q 'function profileRecordBelongsToStudent' android/app/src/main/assets/index.html
          grep -q 'const attendanceList=(items,isLate=false)=>' android/app/src/main/assets/index.html
          grep -q 'window.openStudentProfileAttendanceEdit' android/app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mushrifi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

