name: Check Mushrifi license API
on:
  push:
    branches:
      - feature/device-license-foundation
      - feature/universal-education-platform
    paths:
      - 'licensing/worker/**'
      - '.github/workflows/license-worker-check.yml'
  pull_request:
    paths:
      - 'licensing/worker/**'
      - '.github/workflows/license-worker-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: licensing/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run check
      - name: Validate owner admin CLI
        run: |
          node --check scripts/admin.mjs
          node scripts/admin-cli.test.mjs
      - name: Smoke-test deployed challenge and device proof without issuing a license
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/device-license-foundation' || github.ref == 'refs/heads/feature/universal-education-platform')
        run: node scripts/smoke-test.mjs
