name: Check Mushrifi license API
on:
  push:
    branches:
      - feature/device-license-foundation
      - feature/voice-student-actions
    paths:
      - 'licensing/worker/**'
      - '.github/workflows/license-worker-check.yml'
  pull_request:
    paths:
      - 'licensing/worker/**'
      - '.github/workflows/license-worker-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: licensing/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run check
      - name: Verify annual duration starts at first activation
        run: node tests/license-duration.test.cjs
      - name: Verify activation recovery and admin revocation safeguards
        run: node tests/license-lifecycle.test.cjs
      - name: Verify Android and Worker RSA signing contract
        run: node tests/license-key-compat.test.cjs
      - name: Exercise Worker endpoints against a fresh local D1 database
        run: |
          npx wrangler d1 execute mushrifi-licenses --local --file=./schema.sql
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/mushrifi-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/health
          MUSHRIFI_LICENSE_API=http://127.0.0.1:8787 node scripts/smoke-test.mjs
      - name: Smoke-test deployed challenge and device proof without issuing a license
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/device-license-foundation' || github.ref == 'refs/heads/feature/voice-student-actions')
        run: node scripts/smoke-test.mjs
