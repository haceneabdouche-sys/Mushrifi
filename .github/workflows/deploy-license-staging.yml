name: Deploy Mushrifi license Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mushrifi-license-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy Staging Worker only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out licensing development branch
        uses: actions/checkout@v4
        with:
          ref: feature/device-license-foundation

      - name: Verify TypeScript
        working-directory: licensing/worker
        run: |
          npm install
          npm run check

      - name: Deploy Staging Worker only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: licensing/worker
          wranglerVersion: "4.165.0"
          command: deploy --config wrangler.staging.toml
