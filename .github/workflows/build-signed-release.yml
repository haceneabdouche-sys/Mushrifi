name: Build permanently signed Mushrifi release
# Signed builds for this branch are triggered by the protected default-branch workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MUSHRIFI_KEYSTORE_BASE64: ${{ secrets.MUSHRIFI_KEYSTORE_BASE64 }}
      MUSHRIFI_KEYSTORE_PASSWORD: ${{ secrets.MUSHRIFI_KEYSTORE_PASSWORD }}
      MUSHRIFI_KEY_ALIAS: ${{ secrets.MUSHRIFI_KEY_ALIAS }}
      MUSHRIFI_KEY_PASSWORD: ${{ secrets.MUSHRIFI_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate signing secrets and prepare private keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in MUSHRIFI_KEYSTORE_BASE64 MUSHRIFI_KEYSTORE_PASSWORD MUSHRIFI_KEY_ALIAS MUSHRIFI_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$MUSHRIFI_KEYSTORE_BASE64" | base64 --decode > "$MUSHRIFI_KEYSTORE_PATH"
          test -s "$MUSHRIFI_KEYSTORE_PATH"
          chmod 600 "$MUSHRIFI_KEYSTORE_PATH"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate embedded JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Extractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.inside = True
                      self.current = []
              def handle_data(self, data):
                  if self.inside:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.inside:
                      self.parts.append("".join(self.current))
                      self.inside = False
          parser = Extractor()
          parser.feed(Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8"))
          source = "\\n".join(part for part in parser.parts if part.strip())
          if not source.strip():
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/mushrifi-inline.js").write_text(source, encoding="utf-8")
          PY
          node --check /tmp/mushrifi-inline.js
      - name: Build signed release APK
        run: gradle --no-daemon -p android assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mushrifi-permanent-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
